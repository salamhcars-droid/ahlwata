    <script>
    (function(){
      var _ek=null;
      fetch('/api/enc-config').then(function(r){return r.json()}).then(function(d){
        _ek=Uint8Array.from(atob(d.k),function(c){return c.charCodeAt(0)}).slice(0,32);
        var pad=new Uint8Array(32);pad.set(_ek);_ek=pad;
      }).catch(function(){});

      function toHex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}

      async function encryptData(obj){
        if(!_ek)return obj;
        try{
          var iv=crypto.getRandomValues(new Uint8Array(16));
          var key=await crypto.subtle.importKey('raw',_ek,{name:'AES-CBC'},false,['encrypt']);
          var enc=new TextEncoder();
          var data=enc.encode(JSON.stringify(obj));
          var ct=await crypto.subtle.encrypt({name:'AES-CBC',iv:iv},key,data);
          var payload=JSON.stringify({iv:toHex(iv),d:toHex(ct)});
          return {_enc:btoa(payload)};
        }catch(e){return obj}
      }

      var _origFetch=window.fetch;
      window.fetch=async function(url,opts){
        if(typeof url==='string'&&url.indexOf('/api/trpc/')!==-1&&opts&&opts.method==='POST'&&opts.body){
          try{
            var body=JSON.parse(opts.body);
            var keys=Object.keys(body);
            for(var i=0;i<keys.length;i++){
              var k=keys[i];
              if(body[k]&&body[k].json){
                body[k].json=await encryptData(body[k].json);
              }
            }
            opts=Object.assign({},opts,{body:JSON.stringify(body)});
          }catch(e){}
        }
        return _origFetch.call(this,url,opts);
      };
    })();
    </script>

    <script>
    (function(){
      if(location.pathname.startsWith('/admin')) return;
      var key='pw_visitor_sid';
      var sid=sessionStorage.getItem(key);
      if(!sid){sid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem(key,sid)}
      function page(){var p=location.pathname.replace(/^\//,'');return p||'home'}
      function send(){
        try{fetch('/api/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sid,currentPage:page()})})}catch(e){}
      }
      send();
      setInterval(send,3000);
    })();
